services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: activiity-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: activiity-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull:
    image: curlimages/curl:8.7.1
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -c "curl -s http://ollama:11434/api/pull -d '{\"name\":\"bge-m3\"}'"

  ingest:
    build: .
    depends_on:
      qdrant:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBED_PROVIDER=ollama
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=bge-m3
    command: ["python", "-m", "lib.activiity.ingest.cli"]

  chatbot:
    build: .
    container_name: activiity-chatbot
    ports:
      - "8788:8788"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - EMBED_PROVIDER=ollama
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=bge-m3
    depends_on:
      ingest:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
